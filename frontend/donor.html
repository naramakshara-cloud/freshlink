<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreshLink – Donor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="guarded">
  <nav class="navbar" id="navbar"></nav>
  <header class="page-hero donor-hero">
    <div class="hero-content">
      <h1>Post Surplus Food</h1>
      <p>Turn today's extra food into tomorrow's meal for someone in need.</p>
    </div>
  </header>
  <main class="container">
    <div id="toast" class="toast hidden"></div>
    <section class="card form-card">
      <h2 class="card-title">📦 New Food Listing</h2>
      <form id="donorForm" novalidate>
        <div class="form-grid">
          <div class="form-group">
            <label for="donorSelect">Posting as</label>
            <select id="donorSelect" required>
              <option value="">Loading…</option>
            </select>
          </div>
          <div class="form-group">
            <label for="categorySelect">Food Category</label>
            <select id="categorySelect" required>
              <option value="">Loading categories…</option>
            </select>
          </div>
          <div class="form-group full-width">
            <label for="titleInput">Food Title</label>
            <input type="text" id="titleInput" placeholder="e.g. Veg Pulao and Dal" required />
          </div>
          <div class="form-group full-width">
            <label for="descInput">Description <span class="optional">(optional)</span></label>
            <textarea id="descInput" rows="2" placeholder="Any details about packaging, allergies, etc."></textarea>
          </div>
          <div class="form-group">
            <label for="quantityInput">Quantity (kg)</label>
            <input type="number" id="quantityInput" min="0.1" step="0.1" placeholder="e.g. 5.5" required />
          </div>
          <div class="form-group">
            <label for="servingsInput">Servings <span class="optional">(optional)</span></label>
            <input type="number" id="servingsInput" min="1" placeholder="e.g. 20" />
          </div>
          <div class="form-group">
            <label for="preparedAt">Prepared At</label>
            <input type="datetime-local" id="preparedAt" required />
          </div>
          <div class="form-group">
            <label for="expiresAt">Donor Expiry Time</label>
            <input type="datetime-local" id="expiresAt" required />
          </div>
          <div class="form-group">
            <label for="isVegSelect">Dietary Type</label>
            <select id="isVegSelect">
              <option value="true">🌱 Vegetarian</option>
              <option value="false">🍖 Non-Vegetarian</option>
            </select>
          </div>
          <div class="form-group">
            <label for="animalSelect">Animal Shelter Suitable?</label>
            <select id="animalSelect">
              <option value="false">❌ No (Humans Only)</option>
              <option value="true">🐾 Yes (Safe for Animals/Pets)</option>
            </select>
          </div>
          <div class="form-group full-width">
            <label for="allergensInput">Allergens <span class="optional">(optional, e.g. Dairy, Peanuts, Gluten)</span></label>
            <input type="text" id="allergensInput" placeholder="e.g. Contains dairy, peanuts" />
          </div>
          <div class="form-group full-width">
            <label for="pickupInstInput">Pickup Instructions & Location Details</label>
            <input type="text" id="pickupInstInput" placeholder="e.g. Collect at counter #2, ask for chef Ramesh" />
          </div>
        </div>
        <div class="freshness-preview" id="freshnessPreview" style="display:none">
          <span class="preview-label">Estimated freshness right now:</span>
          <span class="badge" id="previewBadge">–</span>
          <span id="previewScore"></span>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">
          🚀 Post Listing
        </button>
      </form>
    </section>
    <section class="card" id="myListingsCard">
      <h2 class="card-title">📋 My Listings</h2>
      <p class="card-note">Give the pickup code to the person who collects the food. It stays here until they confirm pickup.</p>
      <div id="myListings" class="listing-grid"></div>
    </section>
  </main>
  <script src="api.js"></script>
  <script src="nav.js"></script>
  <script src="donor.js"></script>
</body>
</html>
